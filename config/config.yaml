# Surf E-Ink Frame Configuration
# All settings here - no code changes needed to adjust behavior

# ========== CAMERA SOURCES ==========
cameras:
  - name: "Tel Aviv - Jaffa & Western Beach"
    url: "https://ipcamlive.com/player/snapshot.php?alias=664cd75b7639c"
    enabled: true
    priority: 1
    type: "snapshot"
    scoring_profile: "jaffa"
    # Crop out the "(c)BeachCam Israel" watermark at the top
    # Format: [left, top, right, bottom]
    crop_box: [0, 80, 1920, 1080]
    wait_seconds: 0

  # Keep Hamaaravi as fallback (might come back online)
  - name: "Tel Aviv - Hamaaravi Beach"
    url: "https://beachcam.co.il/hamaaravi.html"
    enabled: false  # Disabled - gocamstream is down
    priority: 2
    type: "webrtc"
    crop_box: null
    wait_seconds: 15

  # Add more cameras as fallback
  # - name: "Tel Aviv - Gordon Beach"
  #   url: "https://example.com/gordon"
  #   enabled: false
  #   priority: 2
  #   type: "webrtc"
  #   crop_box: [100, 50, 1800, 950]

# ========== TIMING ==========
timing:
  fetch_interval_minutes: 5
  esp_sleep_minutes: 30
  retry_on_fail_seconds: 60
  max_retries: 3

  # Only fetch during daytime
  active_hours:
    enabled: true
    start: "06:00"
    end: "20:00"  # Fallback if sunset API unavailable
    timezone: "Asia/Jerusalem"
    # End time is automatically set to sunset (fetched daily from Open-Meteo)

# ========== DISPLAY (E-Ink) ==========
display:
  width: 1600
  height: 1200
  # Color modes: "7color", "6color", "5color", "3color", "bw"
  color_mode: "6color"
  # Dithering: true = detail with some noise, false = flat/posterized
  dithering: true

# ========== OVERLAY ==========
# Minimal text overlay on image (not a separate bar)
overlay:
  enabled: true
  style: "minimal"  # minimal = clean text on image
  show:
    location: true
    wave_height: true
    wind_direction: true
    rating_badge: true  # Top-right surf quality badge

# ========== SURF PREFERENCES ==========
# Used to calculate surf quality rating
surf_preferences:
  min_wave_cm: 75   # Your minimum preferred wave height
  max_wave_cm: 110  # Your maximum preferred wave height
  max_wind_kmh: 25  # Maximum acceptable wind speed

# ========== SURF & WEATHER API ==========
# Using Open-Meteo (free, no API key needed)
weather:
  enabled: true
  provider: "open-meteo"
  location:
    lat: 32.0853
    lon: 34.7818
    name: "Tel Aviv"

# ========== GUEST BEACHES ==========
# Once per day, at a random time, show a different beach
guest_beaches:
  enabled: true
  cameras:
    # --- Verified live ---
    - name: "Supertubos"
      url: "https://video-auth1.iol.pt/beachcam/supertubos/playlist.m3u8"
      type: "hls"
      crop_box: [0, 50, 1920, 1080]  # Remove MEO BEACHCAM watermark
      rotation: 4.5
      timezone: "Europe/Lisbon"
      scoring_profile: "beach"
      location:
        lat: 39.3483
        lon: -9.3592
        name: "Supertubos"
    - name: "Dahab"
      url: "https://webcam.harry-nass.com/dahab-live.jpg"
      type: "snapshot"
      crop_box: [0, 0, 2688, 1480]  # Remove watermark at bottom
      timezone: "Africa/Cairo"
      scoring_profile: "beach"
      location:
        lat: 28.5007
        lon: 34.5133
        name: "Dahab"
    - name: "Ilia Beach, Evia"
      # JPEG snapshot from Ilia Mare Hotel cam (2560x1440)
      # Cache-busting param needed: Cloudflare caches aggressively (max-age=14400)
      # On Pi: curl -so frame.jpg "URL?t=$(date +%s)"
      # HLS alternative: https://live.iliamare.gr/memfs/9fb933aa-5d49-4b6c-a004-fe8f3fc9f282.m3u8
      url: "https://live.iliamare.gr/memfs/9fb933aa-5d49-4b6c-a004-fe8f3fc9f282.jpg"
      type: "snapshot"
      crop_box: [0, 130, 2560, 1440] # Crop top timestamp + ILIA MARE HOTEL text
      rotation: 5.0 
      timezone: "Europe/Athens"
      scoring_profile: "beach"
      location:
        lat: 38.8489
        lon: 23.1236
        name: "Ilia Beach, Evia"
    - name: "Niagara Falls"
      url: "https://images-webcams.windy.com/91/1240237991/current/full/1240237991.jpg"
      type: "snapshot"
      crop_box: [0, 0, 1280, 690]  # Crop bottom bar
      timezone: "America/New_York"
      scoring_profile: "beach"
      location:
        lat: 43.0896
        lon: -79.0849
        name: "Niagara Falls"
    - name: "Taylors Mistake, NZ"
      url: "https://stream.webmad.co.nz/shots/taylorseast.jpg"
      type: "snapshot"
      crop_box: [0, 60, 1280, 690]  # Crop top/bottom watermarks
      timezone: "Pacific/Auckland"
      scoring_profile: "beach"
      location:
        lat: -43.5731
        lon: 172.7636
        name: "Taylors Mistake, NZ"
    - name: "Ko Tao"
      # YouTube sddefault_live thumbnail (640x480, updates ~5min)
      # UNVERIFIED — needs daytime test (Thai daytime = 5-10am Israel)
      url: "https://img.youtube.com/vi/GF_ipELqzV4/sddefault_live.jpg"
      type: "snapshot"
      crop_box: [0, 62, 640, 418]  # Remove letterbox black bars
      timezone: "Asia/Bangkok"
      scoring_profile: "beach"
      location:
        lat: 10.0956
        lon: 99.8378
        name: "Ko Tao"

# ========== AD DETECTION ==========
filter:
  # Reject frames with too much text (likely ads)
  max_text_area_percent: 15
  # Reject frames with unusual colors (not sea/sky/sand)
  check_color_distribution: true
  # Expected dominant colors for beach scene
  expected_colors: ["blue", "tan", "white", "gray"]
  # Minimum similarity to last known good frame
  min_similarity: 0.3

# ========== HTTP SERVER ==========
server:
  host: "0.0.0.0"
  port: 8080

# ========== PATHS ==========
paths:
  data_dir: "./data"
  current_image: "./data/current.bmp"
  current_raw: "./data/current_raw.png"
  metadata: "./data/metadata.json"

# ========== LOGGING ==========
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./data/beachcam.log"
