# Surf E-Ink Frame Configuration
# All settings here - no code changes needed to adjust behavior

# ========== CAMERA SOURCES ==========
cameras:
  - name: "Tel Aviv - Jaffa & Western Beach"
    url: "https://ipcamlive.com/player/snapshot.php?alias=664cd75b7639c"
    enabled: true
    priority: 1
    type: "snapshot"
    scoring_profile: "jaffa"
    # Crop out the "(c)BeachCam Israel" watermark at the top
    # Format: [left, top, right, bottom]
    crop_box: [0, 80, 1920, 1080]
    # Fraction of the CROPPED frame height that is actually sky, used by the
    # golden-hour scorer. Measured on this camera: the horizon sits at row 234
    # of the 1080-row raw frame, and crop_box drops the top 80, leaving sky at
    # 154/1000 = 15.4% of the cropped height. The scorer previously assumed
    # 60%, so three quarters of its "sky" was sea.
    sky_fraction: 0.15
    wait_seconds: 0

# ========== TIMING ==========
timing:
  fetch_interval_minutes: 5
  esp_sleep_minutes: 30
  retry_on_fail_seconds: 60
  max_retries: 3

  # Only fetch during daytime
  active_hours:
    enabled: true
    start: "06:00"
    end: "20:00"  # Fallback if sunset API unavailable
    timezone: "Asia/Jerusalem"
    # End time is automatically set to sunset (fetched daily from Open-Meteo)

  # Inside the golden-hour window the scorer adds a warm-sky bonus on top of
  # the base profile score. The "goodnight image" served on the panel all
  # night long is picked from this window — boosting warm-colored frames here
  # makes the bonus strong enough to outscore high-composition daytime frames
  # still in the candidate pool.
  #
  # Sunrise uses a symmetric ±N window:
  golden_hour_window_minutes: 15

  # Sunset is ASYMMETRIC on purpose. On a west-facing Tel Aviv beach the best
  # colour lands AFTER the sun is below the horizon — the afterglow typically
  # peaks around sunset+10..+25, during civil twilight. The old symmetric
  # ±15 window spent half its frames on bright pre-sunset sky and then stopped
  # looking at sunset+15, right as the sky got good.
  sunset_window_before_minutes: 5
  sunset_window_after_minutes: 30

  # Active hours (and the ESP's final "goodnight grab" wake) extend past the
  # window by this pad so the last frames of the window are actually fetched
  # and the ESP pulls only once the window has fully closed.
  sunset_active_pad_minutes: 5

  # Tighter sampling inside the golden-hour window. Sunset colour changes on a
  # 1-2 minute timescale, so the normal 5-min cadence yields only ~6 frames
  # and can miss the peak entirely.
  golden_hour_fetch_interval_minutes: 2

# ========== CANDIDATE SELECTION ==========
selection:
  # Highest score wins, but once two frames are within this margin the colour
  # terms have stopped discriminating — on 2026-08-22 the top two differed by
  # 0.0084 with identical base scores, yet one was visibly soft (2.6x less edge
  # energy) because the webcam degrades as light fades. Within the margin, the
  # sharper frame wins instead.
  #
  # Keep this SMALL. Sharpness is not a quality-of-sunset signal — the sharpest
  # frame of an evening is usually an early, bright, colourless one — so a wide
  # margin would let crisp-but-dull frames beat real sunsets. 0 disables it.
  sharpness_tiebreak_margin: 0.05

# ========== DISPLAY (E-Ink) ==========
display:
  width: 1200
  height: 1600
  # Color modes: "7color", "6color", "5color", "3color", "bw"
  color_mode: "6color"
  # Dithering: true = detail with some noise, false = flat/posterized
  dithering: true
  # Rotation (degrees, clockwise) applied to the rendered image to compensate
  # for how the panel is physically mounted. The Waveshare 13.3" HAT is
  # native-portrait with the USB connector at the bottom; if you mount the
  # panel landscape with USB on the left (90° CCW rotation in viewer's frame),
  # set this to 90 so the image rotates 90° CW to appear upright. Use 270 if
  # the image comes out upside-down. Valid: 0, 90, 180, 270.
  rotation: 90
  # Color preprocessing applied before dithering. Spectra 6 only has 6 palette
  # entries, so muted source pixels (overcast skies, beige sand, faded rocks)
  # tend to quantize to white/black instead of using the chromatic colors.
  # Boosting saturation pulls those toward red/yellow/blue/green so the panel
  # uses more of its gamut. Contrast boost helps separate sky/sea/sand into
  # distinct quantized regions instead of a mid-tone mush. 1.0 = no change.
  # Tune in increments of 0.1; values above 1.7 typically over-saturate.
  # Lowered 1.2 -> 1.05: at 1.2 neutral haze was being pushed far enough
  # toward the chromatic anchors that pale sky/sand quantized to red and
  # green speckle (22% of the frame combined), both dark inks on Spectra 6.
  saturation: 1.05
  contrast: 1.0
  # Gamma curve applied before the linear brightness multiplier. >1.0 lifts
  # midtones (sea, vegetation, shadows on sand) while preserving highlights
  # (bright sand, sky) from clipping to white. This is the main "make image
  # brighter without losing detail" knob — much safer than the linear
  # brightness multiplier, which always clips highlights first.
  # 1.0 = no change, 1.4 = moderate lift, 1.7 = strong lift, 2.0+ = washed.
  gamma: 1.3
  # "Reddish filter" — per-channel gains applied after gamma, before the
  # overlay. Pushes warm pixels toward the red/yellow anchors.
  #
  # Trade-off, measured by re-rendering a real sunset frame through the full
  # pipeline at these values: BRIGHTER (bright ink 45.2% -> 51.9%) but LESS
  # colourful (63.4% -> 59.2%), because blue sea converts to white and red —
  # blue 31% -> 20%. The sea reads less like sea and more like a warm wash.
  # 1.0 / 1.0 disables. Milder: 1.05 / 0.97.
  #
  # DISABLED 2026-09-02. Re-measured on a morning frame, where the filter does
  # real damage: it inflates sand's warmth (r-b 37 -> 64 before quantization),
  # which on an empty morning beach turns the whole lower third into a flat
  # slab of yellow ink. Turning it off gives, on that frame:
  #   beach yellow 40.6% -> 34.5%   sea blue 67.7% -> 75.8%
  #   sea yellow    8.1% ->  4.7%   red ink   6.9% ->  3.2%
  # The cost is bright ink 26.1% -> 21.5%, but brightness changes at this scale
  # have never been visible on the glass (see the panel-brightness notes: the
  # panel is at its reflectance ceiling), whereas the colour change is obvious.
  # Set back to 1.10 / 0.94 to restore.
  warm_gain_r: 1.0
  warm_gain_b: 1.0
  # Final linear brightness multiplier after gamma. Use sparingly — gamma
  # is the preferred lever. 1.0 = no additional lift.
  brightness: 1.0

# ========== OVERLAY ==========
# Minimal text overlay on image (not a separate bar)
overlay:
  enabled: true
  style: "minimal"  # minimal = clean text on image
  show:
    location: true
    wave_height: true
    wind_direction: true
    rating_badge: true  # Top-right surf quality badge

# ========== SURF PREFERENCES ==========
# Used to calculate surf quality rating
surf_preferences:
  min_wave_cm: 75   # Your minimum preferred wave height
  max_wave_cm: 110  # Your maximum preferred wave height
  max_wind_kmh: 25  # Maximum acceptable wind speed

# ========== SURF & WEATHER API ==========
# Using Open-Meteo (free, no API key needed)
weather:
  enabled: true
  provider: "open-meteo"
  location:
    lat: 32.0853
    lon: 34.7818
    name: "Tel Aviv"

# ========== GUEST BEACHES ==========
# Once per day, at a random time, show a different beach
guest_beaches:
  enabled: true
  # The day must always END on the sunset image, never on a guest beach.
  # Guest start times are held this many minutes clear of raw sunset, which
  # leaves time for the guest to be shown AND replaced by the main camera
  # before the golden window opens. Any guest still active when the window
  # starts is retired immediately regardless of this value.
  min_minutes_before_sunset: 90
  cameras:
    # --- Verified live ---
    - name: "Baleal"
      url: "https://video-auth1.iol.pt/beachcam/bcbalealgeral/playlist.m3u8"
      type: "hls"
      crop_box: [0, 80, 2560, 1440]  # Remove MEO BEACHCAM watermark
      timezone: "Europe/Lisbon"
      scoring_profile: "beach"
      location:
        lat: 39.3725
        lon: -9.3394
        name: "Baleal"
    - name: "Dahab"
      url: "https://webcam.harry-nass.com/dahab-live.jpg"
      type: "snapshot"
      crop_box: [0, 0, 2688, 1480]  # Remove watermark at bottom
      timezone: "Africa/Cairo"
      scoring_profile: "beach"
      location:
        lat: 28.5007
        lon: 34.5133
        name: "Dahab"
    - name: "Ilia Beach, Evia"
      # JPEG snapshot from Ilia Mare Hotel cam (2560x1440)
      # Cache-busting param needed: Cloudflare caches aggressively (max-age=14400)
      # On Pi: curl -so frame.jpg "URL?t=$(date +%s)"
      # HLS alternative: https://live.iliamare.gr/memfs/9fb933aa-5d49-4b6c-a004-fe8f3fc9f282.m3u8
      url: "https://live.iliamare.gr/memfs/9fb933aa-5d49-4b6c-a004-fe8f3fc9f282.jpg"
      type: "snapshot"
      crop_box: [0, 130, 2560, 1440] # Crop top timestamp + ILIA MARE HOTEL text
      rotation: 5.0 
      timezone: "Europe/Athens"
      scoring_profile: "beach"
      location:
        lat: 38.8489
        lon: 23.1236
        name: "Ilia Beach, Evia"
    - name: "Niagara Falls"
      url: "https://images-webcams.windy.com/91/1240237991/current/full/1240237991.jpg"
      type: "snapshot"
      crop_box: [0, 0, 1280, 690]  # Crop bottom bar
      timezone: "America/New_York"
      scoring_profile: "beach"
      location:
        lat: 43.0896
        lon: -79.0849
        name: "Niagara Falls"
    - name: "Taylors Mistake, NZ"
      url: "https://stream.webmad.co.nz/shots/taylorseast.jpg"
      type: "snapshot"
      crop_box: [0, 60, 1280, 690]  # Crop top/bottom watermarks
      timezone: "Pacific/Auckland"
      scoring_profile: "beach"
      location:
        lat: -43.5731
        lon: 172.7636
        name: "Taylors Mistake, NZ"

# ========== AD DETECTION ==========
filter:
  # Reject frames with too much text (likely ads)
  max_text_area_percent: 15
  # Reject frames with unusual colors (not sea/sky/sand)
  check_color_distribution: true
  # Expected dominant colors for beach scene
  expected_colors: ["blue", "tan", "white", "gray"]
  # Minimum similarity to last known good frame
  min_similarity: 0.3

# ========== HTTP SERVER ==========
server:
  host: "0.0.0.0"
  port: 8080

# ========== PATHS ==========
paths:
  data_dir: "./data"
  current_image: "./data/current.bmp"
  current_raw: "./data/current_raw.png"
  metadata: "./data/metadata.json"

# ========== LOGGING ==========
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "./data/beachcam.log"
